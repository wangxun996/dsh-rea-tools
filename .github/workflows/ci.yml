name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check lib/index.js && node --check lib/bridge.js
      - name: Manifest guards
        run: |
          node -e "const p=require('./package.json');if(!p.dsh?.bundle?.patch)throw new Error('missing dsh.bundle.patch');if(p.private)throw new Error('package is private')"
          test -f cordis.patch.yml
          test -f LICENSE
